spring.application.name=salary_insights
# foreign_keys: SQLite only enforces REFERENCES when asked, on every connection.
# date_class/date_string_format: store dates as 2024-01-15, not as milliseconds in
# the writer's time zone (see SqliteDateStorageTest).
sqlite.url-params=foreign_keys=true&date_class=TEXT&date_string_format=yyyy-MM-dd
spring.datasource.url=jdbc:sqlite:${DB_PATH:./salary.db}?${sqlite.url-params}
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=1
# Loaded on startup only into an empty database (EmployeeSeeder)
seed.employees=10000
# The API answers in English whatever Accept-Language the client sends
spring.web.locale=en
spring.web.locale-resolver=fixed
# Browser origins allowed to call the API, comma separated (CorsConfig)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
