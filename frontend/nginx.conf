server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend expects the /api prefix (/api/employees, /api/insights, /api/catalog),
    # so the path goes through unchanged: proxy_pass without a URI keeps it.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The app and the API share this origin, so no CORS is needed. Browsers still send an Origin
        # header on POST/PUT/DELETE, and Spring would compare it with the host it sees behind this
        # proxy, call it cross-origin and answer 403. Without Origin, Spring skips CORS altogether.
        proxy_set_header Origin "";
    }

    # Angular routes (/insights, /employees/7/edit) are not files: let the app handle them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names carry a content hash, so they can be cached for good; index.html must not be
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
